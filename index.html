<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Jadwal Shift CS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#eef1f6;color:#1a1a2e;padding:14px;max-width:760px;margin:0 auto;}
  h1{font-size:19px;color:#1A237E;margin-bottom:2px;}
  .sub{color:#666;font-size:12px;margin-bottom:14px;}
  .card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
  .pick{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  input[type=text]{padding:10px 12px;border:1px solid #cfd2dc;border-radius:8px;font-size:15px;flex:1;min-width:160px;}
  select{padding:10px 12px;border:1px solid #cfd2dc;border-radius:8px;font-size:15px;background:#fff;flex:1;min-width:180px;}
  label{font-size:12px;font-weight:600;color:#444;}
  .role-pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;background:#1A237E;color:#fff;}
  .today-row{display:flex;gap:12px;flex-wrap:wrap;}
  .shiftbox{flex:1;min-width:150px;border-radius:12px;padding:14px;border:2px solid rgba(0,0,0,0.06);}
  .shiftbox .when{font-size:12px;font-weight:700;opacity:0.7;text-transform:uppercase;letter-spacing:0.5px;}
  .shiftbox .name{font-size:20px;font-weight:800;margin:4px 0 2px;}
  .shiftbox .time{font-size:13px;font-weight:600;opacity:0.85;}
  .summary{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{flex:1;min-width:74px;text-align:center;border-radius:10px;padding:10px;border:1px solid #eee;}
  .stat .n{font-size:24px;font-weight:800;} .stat .l{font-size:11px;color:#555;}
  .offdates{margin-top:8px;font-size:13px;color:#444;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;}
  .cal .h{font-size:11px;font-weight:700;text-align:center;color:#666;padding:3px;}
  .cell{border-radius:8px;padding:5px 3px;text-align:center;font-size:11px;min-height:46px;border:1px solid rgba(0,0,0,0.06);}
  .cell .d{font-weight:700;font-size:12px;} .cell .s{font-size:9px;line-height:1.1;margin-top:2px;}
  .cell.empty{background:transparent;border:none;}
  h2{font-size:14px;color:#1A237E;margin-bottom:8px;}
  .daysel{margin:6px 0;}
  .team{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
  .teamgrp{border-radius:8px;padding:8px 10px;}
  .teamgrp .t{font-size:12px;font-weight:700;margin-bottom:3px;}
  .teamgrp .ppl{font-size:12px;line-height:1.5;}
  .me{font-weight:800;text-decoration:underline;}
  .hint{color:#888;font-size:12px;}
  .idtbl{width:100%;border-collapse:collapse;font-size:13px;}
  .idtbl td{padding:6px 8px;border-bottom:1px solid #eee;}
  .idtbl td.k{color:#666;width:130px;font-weight:600;}
  .idtbl td.v{font-weight:700;color:#1a1a2e;} 
  .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#e8eaf6;color:#1A237E;margin-left:4px;font-weight:700;}
</style>
</head>
<body>
<h1 id="title">Dashboard Jadwal Shift CS</h1>
<div class="sub" id="period"></div>

<div class="card">
  <div class="pick">
    <label>Cari nama Anda:</label>
    <input type="text" id="search" placeholder="ketik nama..." oninput="filterList()">
    <select id="who" onchange="render()"><option value="">-- pilih nama --</option></select>
  </div>
</div>

<div id="content" style="display:none;">
  <div class="card">
    <h2>Identitas</h2>
    <table class="idtbl">
      <tr><td class="k">Nama Lengkap</td><td class="v" id="idNama">-</td></tr>
      <tr><td class="k">Posisi</td><td class="v" id="idPosisi">-</td></tr>
      <tr><td class="k">Role</td><td class="v" id="idRole">-</td></tr>
      <tr><td class="k">Mitra ID</td><td class="v" id="idMitra">-</td></tr>
      <tr><td class="k">Vendor</td><td class="v" id="idVendor">-</td></tr>
    </table>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
      <h2 style="margin:0;">Shift Saya</h2><span class="role-pill" id="rolePill"></span>
    </div>
    <div class="today-row" id="todayRow" style="margin-top:8px;"></div>
    <div class="hint" id="todayHint" style="margin-top:8px;"></div>
    <div style="font-size:13px;font-weight:700;color:#1A237E;margin-top:12px;">Minggu Ini (Senin - Minggu)</div>
    <div class="cal" id="weekHead" style="margin-top:6px;"></div>
    <div class="cal" id="weekRow"></div>
  </div>
  <div class="card">
    <h2>Ringkasan Bulan Ini</h2>
    <div class="summary" id="summary"></div>
    <div class="offdates" id="offdates"></div>
  </div>
  <div class="card">
    <h2>Kalender Saya</h2>
    <div class="cal" id="calHead"></div>
    <div class="cal" id="cal"></div>
  </div>
  <div class="card">
    <h2>On-Duty per Hari (semua role)</h2>
    <div class="daysel"><label>Tanggal: </label><select id="odDate" onchange="renderOnDuty()"></select></div>
    <div id="onduty"></div>
  </div>
</div>

var SHIFT_INFO={
  "P":{label:"Pagi",time:"06:45 - 16:00",color:"#E8A878"},
  "Mid":{label:"Middle",time:"08:45 - 18:00",color:"#B3E5FC"},
  "S":{label:"Siang",time:"12:45 - 22:00",color:"#FFF4C2"},
  "M":{label:"Malam",time:"21:45 - 07:00",color:"#E89090"},
  "Off":{label:"Off Day",time:"Libur",color:"#FFE600"}
};
var DAY_ID=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
var MON_ID=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
function wd(d){ return (new Date(DATA.year,DATA.month,d).getDay()+6)%7; }
function info(k){ return SHIFT_INFO[k]||SHIFT_INFO["Off"]; }
var POSISI={SR:"Senior Staff",JR:"Junior Staff",NJ:"New Joiner",SL:"Shiftlead"};

document.getElementById('period').textContent="Periode: "+MON_ID[DATA.month]+" "+DATA.year+"  -  "+DATA.people.length+" MP (HCU+CCU+Shiftlead)";

var order=DATA.people.map(function(p,i){return {name:p.name,role:p.role,i:i};}).sort(function(a,b){return a.name.localeCompare(b.name);});
function fillList(filterTxt){
  var who=document.getElementById('who');
  var cur=who.value;
  who.innerHTML='<option value="">-- pilih nama --</option>';
  var ft=(filterTxt||"").toLowerCase();
  for(var k=0;k<order.length;k++){
    if(ft && order[k].name.toLowerCase().indexOf(ft)<0) continue;
    var o=document.createElement('option'); o.value=order[k].i; o.textContent=order[k].name+"  ("+order[k].role+")"; who.appendChild(o);
  }
}
function filterList(){ fillList(document.getElementById('search').value); }
fillList("");

var od=document.getElementById('odDate');
for(var d2=1; d2<=DATA.nDays; d2++){ var op2=document.createElement('option'); op2.value=d2; op2.textContent=d2+" "+MON_ID[DATA.month].slice(0,3)+" ("+DAY_ID[wd(d2)].slice(0,3)+")"; od.appendChild(op2); }
od.value=(todayIndexInMonth()>0?todayIndexInMonth():1);
renderOnDuty();

function todayIndexInMonth(){ var n=new Date(); if(n.getFullYear()===DATA.year&&n.getMonth()===DATA.month) return n.getDate(); return 0; }

function render(){
  var idx=document.getElementById('who').value;
  if(idx===""){ document.getElementById('content').style.display="none"; return; }
  idx=+idx;
  document.getElementById('content').style.display="block";
  var person=DATA.people[idx]; var row=DATA.sched[idx];
  document.getElementById('idNama').textContent=person.name||"-";
  document.getElementById('idPosisi').textContent=POSISI[person.tier]||person.tier||"-";
  document.getElementById('idRole').textContent=person.role||"-";
  document.getElementById('idMitra').textContent=person.mitraId||"-";
  document.getElementById('idVendor').textContent=person.vendor||"-";
  document.getElementById('rolePill').textContent=person.role+(person.tier&&person.tier!=="SL"?" - "+person.tier:"");

  var tIdx=todayIndexInMonth();
  function box(when,dayNum){
    if(dayNum<1||dayNum>DATA.nDays) return '<div class="shiftbox" style="background:#f5f5f5"><div class="when">'+when+'</div><div class="name">-</div><div class="time">di luar periode</div></div>';
    var ii=info(row[dayNum-1]);
    return '<div class="shiftbox" style="background:'+ii.color+'"><div class="when">'+when+' ('+dayNum+' '+MON_ID[DATA.month].slice(0,3)+')</div><div class="name">'+ii.label+'</div><div class="time">'+ii.time+'</div></div>';
  }
  if(tIdx>0){ document.getElementById('todayRow').innerHTML=box("Hari Ini",tIdx)+box("Besok",tIdx+1); document.getElementById('todayHint').textContent=""; }
  else { document.getElementById('todayRow').innerHTML=box("Hari Pertama",1)+box("Hari Ke-2",2); document.getElementById('todayHint').textContent="Hari ini di luar periode jadwal. Cek kalender di bawah untuk tanggal lain."; }
  renderWeek(row, tIdx>0?tIdx:1);

  var cnt={}; for(var d=0;d<row.length;d++) cnt[row[d]]=(cnt[row[d]]||0)+1;
  var keys=["P","Mid","S","M","Off"]; var sh="";
  for(var s=0;s<keys.length;s++){ var kk=keys[s]; if(kk==="Mid"&&!cnt.Mid) continue; var ii=info(kk);
    sh+='<div class="stat" style="background:'+ii.color+'"><div class="n">'+(cnt[kk]||0)+'</div><div class="l">'+ii.label+'</div></div>'; }
  document.getElementById('summary').innerHTML=sh;
  var offs=[]; for(var d2=0;d2<row.length;d2++) if(row[d2]==="Off") offs.push((d2+1)+" "+MON_ID[DATA.month].slice(0,3));
  document.getElementById('offdates').innerHTML="<b>Tanggal libur saya:</b> "+(offs.length?offs.join(", "):"-");

  var ch=""; for(var c=0;c<7;c++) ch+='<div class="h">'+DAY_ID[c].slice(0,3)+'</div>';
  document.getElementById('calHead').innerHTML=ch;
  var cal=""; var first=wd(1);
  for(var e=0;e<first;e++) cal+='<div class="cell empty"></div>';
  for(var d3=1; d3<=DATA.nDays; d3++){ var ii=info(row[d3-1]); var hl=(tIdx===d3)?'box-shadow:0 0 0 2px #1A237E inset;':'';
    cal+='<div class="cell" style="background:'+ii.color+';'+hl+'"><div class="d">'+d3+'</div><div class="s">'+ii.label+'</div></div>'; }
  document.getElementById('cal').innerHTML=cal;
}
function renderWeek(row, refDay){
  var refWd=wd(refDay);                 // 0=Sen..6=Min
  var monday=refDay-refWd;              // day-number of Monday of that week (bisa <=0)
  var tIdx=todayIndexInMonth();
  var head=""; for(var c=0;c<7;c++) head+='<div class="h">'+DAY_ID[c].slice(0,3)+'</div>';
  document.getElementById('weekHead').innerHTML=head;
  var html="";
  for(var o=0;o<7;o++){
    var dn=monday+o;
    if(dn<1||dn>DATA.nDays){ html+='<div class="cell" style="background:#f0f0f0;color:#aaa"><div class="d">-</div><div class="s">luar bulan</div></div>'; continue; }
    var ii=info(row[dn-1]);
    var hl=(tIdx===dn)?'box-shadow:0 0 0 2px #1A237E inset;':'';
    html+='<div class="cell" style="background:'+ii.color+';'+hl+'"><div class="d">'+dn+'</div><div class="s">'+ii.label+'</div></div>';
  }
  document.getElementById('weekRow').innerHTML=html;
}
function renderOnDuty(){
  var day=+document.getElementById('odDate').value; if(!day||day<1) day=1;
  var roles=["Shiftlead","HCU","CCU","New_Joiner"];
  var shiftOrder=["P","Mid","S","M","Off"];
  var html="";
  for(var ri=0;ri<roles.length;ri++){
    var role=roles[ri];
    // group this role's people by shift on this day
    var grp={}; var total=0;
    for(var i=0;i<DATA.people.length;i++){ if(DATA.people[i].role!==role) continue; var k=DATA.sched[i][day-1]; if(!grp[k])grp[k]=[]; grp[k].push(i); total++; }
    if(total===0) continue;
    html+='<div style="margin:8px 0 4px;font-weight:800;color:#1A237E;font-size:13px;">'+role+'</div>';
    for(var s=0;s<shiftOrder.length;s++){ var kk=shiftOrder[s]; var arr=grp[kk]||[]; if(!arr.length) continue; var ii=info(kk);
      var ppl=arr.map(function(i){ var nm=DATA.people[i].name; var tg=(DATA.people[i].tier&&DATA.people[i].tier!=="SL")?'<span class="badge">'+DATA.people[i].tier+'</span>':''; return nm+tg; }).join(", ");
      html+='<div class="teamgrp" style="background:'+ii.color+';margin-top:4px;"><div class="t">'+ii.label+' - '+arr.length+' orang</div><div class="ppl">'+ppl+'</div></div>'; }
  }
  document.getElementById('onduty').innerHTML=html;
}
</script>
