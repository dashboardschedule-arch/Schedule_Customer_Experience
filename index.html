<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Jadwal Shift CS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#eef1f6;color:#1a1a2e;padding:14px;max-width:900px;margin:0 auto;}
  h1{font-size:19px;color:#1A237E;margin-bottom:2px;}
  .sub{color:#666;font-size:12px;margin-bottom:14px;}
  .card{background:#fff;border-radius:12px;padding:14px 16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
  .pick{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;}
  .ctrl{display:flex;flex-direction:column;gap:4px;}
  .ctrl.grow{flex:1;min-width:200px;}
  input[type=text]{padding:9px 12px;border:1px solid #cfd2dc;border-radius:8px;font-size:15px;flex:1;min-width:120px;}
  select{padding:9px 12px;border:1px solid #cfd2dc;border-radius:8px;font-size:15px;background:#fff;}
  label{font-size:11px;font-weight:700;color:#444;text-transform:uppercase;letter-spacing:.4px;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid #eee;}
  .lg{font-size:11px;color:#444;display:flex;align-items:center;gap:5px;}
  .sw{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.1);display:inline-block;}
  .role-pill{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;background:#1A237E;color:#fff;}
  .today-row{display:flex;gap:12px;flex-wrap:wrap;}
  .shiftbox{flex:1;min-width:150px;border-radius:12px;padding:14px;border:2px solid rgba(0,0,0,0.06);}
  .shiftbox .when{font-size:12px;font-weight:700;opacity:0.7;text-transform:uppercase;letter-spacing:0.5px;}
  .shiftbox .name{font-size:20px;font-weight:800;margin:4px 0 2px;}
  .shiftbox .time{font-size:13px;font-weight:600;opacity:0.85;}
  .summary{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{flex:1;min-width:74px;text-align:center;border-radius:10px;padding:10px;border:1px solid #eee;}
  .stat .n{font-size:24px;font-weight:800;} .stat .l{font-size:11px;color:#555;}
  .offdates{margin-top:8px;font-size:13px;color:#444;}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;}
  .cal .h{font-size:11px;font-weight:700;text-align:center;color:#666;padding:3px;}
  .cell{border-radius:8px;padding:5px 3px;text-align:center;font-size:11px;min-height:46px;border:1px solid rgba(0,0,0,0.06);}
  .cell .d{font-weight:700;font-size:12px;} .cell .s{font-size:9px;line-height:1.1;margin-top:2px;}
  .cell.empty{background:transparent;border:none;}
  h2{font-size:14px;color:#1A237E;margin-bottom:8px;}
  .daysel{margin:6px 0;}
  .teamgrp{border-radius:8px;padding:8px 10px;margin-top:4px;}
  .teamgrp .t{font-size:12px;font-weight:700;margin-bottom:3px;}
  .teamgrp .ppl{font-size:12px;line-height:1.5;}
  .hint{color:#888;font-size:11px;font-weight:400;}
  .idtbl{width:100%;border-collapse:collapse;font-size:13px;}
  .idtbl td{padding:6px 8px;border-bottom:1px solid #eee;}
  .idtbl td.k{color:#666;width:130px;font-weight:600;}
  .idtbl td.v{font-weight:700;color:#1a1a2e;}
  .badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#e8eaf6;color:#1A237E;margin-left:4px;font-weight:700;}
  .gridwrap{overflow-x:auto;border:1px solid #eee;border-radius:8px;}
  table.grid{border-collapse:collapse;font-size:10px;table-layout:fixed;}
  .grid th,.grid td{border:1px solid #e6e6ee;padding:3px 0;text-align:center;white-space:nowrap;width:32px;overflow:hidden;text-overflow:ellipsis;}
  .grid th{background:#1A237E;color:#fff;font-size:10px;position:sticky;top:0;}
  .grid th.wknd{background:#3949AB;}
  .grid td.nm,.grid th.nm{position:sticky;left:0;background:#fff;text-align:left;width:170px;min-width:170px;max-width:170px;overflow:hidden;text-overflow:ellipsis;font-weight:700;z-index:2;padding-left:6px;}
  .grid th.nm{background:#1A237E;color:#fff;z-index:3;}
  .grid td.cellg{font-weight:700;color:#1a1a2e;}
  .grid td.tcol{box-shadow:0 0 0 2px #1A237E inset;}
  .grid td.tier{font-weight:600;color:#555;background:#f7f8fc;}
  .rolechk{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;padding:4px 0;}
  .rchk{font-size:13px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap;}
  .rchk input{margin:0;cursor:pointer;}
</style>
</head>
<body>
<h1 id="title">Dashboard Jadwal Shift CS</h1>
<div class="sub" id="period"></div>

<div class="card">
  <div class="pick">
    <div class="ctrl"><label>Bulan</label><select id="msel" onchange="onMonth()"></select></div>
    <div class="ctrl"><label>Role <span class="hint">(bisa pilih >1)</span></label><div id="rsel" class="rolechk"></div></div>
    <div class="ctrl grow"><label>Nama</label>
      <select id="who" onchange="render()" style="width:100%;"><option value="">-- pilih nama --</option></select>
    </div>
  </div>
  <div class="legend" id="legend"></div>
</div>

<div id="gridCard" class="card" style="display:none;">
  <h2>Grid Jadwal &mdash; <span id="gridRole"></span> <span class="hint" id="gridCount"></span></h2>
  <div class="gridwrap"><table class="grid" id="gridTbl"></table></div>
  <h2 style="margin-top:18px">Rekap MP Duty per Hari <span class="hint">(muncul saat role difilter)</span></h2>
  <div class="gridwrap"><table class="grid" id="gridRecap"></table></div>
</div>

<div id="content" style="display:none;">
  <div class="card">
    <h2>Identitas</h2>
    <table class="idtbl">
      <tr><td class="k">Nama Lengkap</td><td class="v" id="idNama">-</td></tr>
      <tr><td class="k">Posisi</td><td class="v" id="idPosisi">-</td></tr>
      <tr><td class="k">Role</td><td class="v" id="idRole">-</td></tr>
      <tr><td class="k">Mitra ID</td><td class="v" id="idMitra">-</td></tr>
      <tr><td class="k">Vendor</td><td class="v" id="idVendor">-</td></tr>
      <tr><td class="k">Jenis Kelamin</td><td class="v" id="idGender">-</td></tr>
    </table>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;">
      <h2 style="margin:0;">Shift Saya</h2><span class="role-pill" id="rolePill"></span>
    </div>
    <div class="today-row" id="todayRow" style="margin-top:8px;"></div>
    <div class="hint" id="todayHint" style="margin-top:8px;"></div>
    <div style="font-size:13px;font-weight:700;color:#1A237E;margin-top:12px;">Minggu Ini (Senin - Minggu)</div>
    <div class="cal" id="weekHead" style="margin-top:6px;"></div>
    <div class="cal" id="weekRow"></div>
  </div>
  <div class="card">
    <h2>Ringkasan Bulan Ini</h2>
    <div class="summary" id="summary"></div>
    <div class="offdates" id="offdates"></div>
  </div>
  <div class="card">
    <h2>Kalender Saya</h2>
    <div class="cal" id="calHead"></div>
    <div class="cal" id="cal"></div>
  </div>
</div>

<div class="card">
  <h2>On-Duty per Hari <span class="hint" id="odRoleLbl"></span></h2>
  <div class="daysel" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <label style="text-transform:none;font-size:12px;">Tanggal: </label>
    <select id="odDate" onchange="renderOnDuty()"></select>
    <label style="text-transform:none;font-size:12px;margin-left:6px;">Shift: </label>
    <select id="odShift" onchange="renderOnDuty()">
      <option value="">Semua shift</option>
      <option value="P">Pagi</option><option value="Mid">Middle</option>
      <option value="S">Siang</option><option value="M">Malam</option><option value="Off">Off Day</option>
    </select>
  </div>
  <div id="onduty"></div>
</div>

var SHIFT_INFO={
  "P":{label:"Pagi",time:"06:45 - 16:00",color:"#E8A878"},
  "Mid":{label:"Middle",time:"08:45 - 18:00",color:"#B3E5FC"},
  "S":{label:"Siang",time:"12:45 - 22:00",color:"#FFF4C2"},
  "M":{label:"Malam",time:"21:45 - 07:00",color:"#E89090"},
  "Off":{label:"Off Day",time:"Libur",color:"#FFE600"},
  "Resign":{label:"Resign",time:"-",color:"#BDBDBD"}
};
var DAY_ID=["Senin","Selasa","Rabu","Kamis","Jumat","Sabtu","Minggu"];
var MON_ID=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
var POSISI={SR:"Senior Staff",JR:"Junior Staff",NJ:"New Joiner",SL:"Shiftlead"};
var ROLES=["Shiftlead","HCU","CCU","New_Joiner_CCU","New_Joiner_HCU","New_Joiner"];
var ROLE_LABEL={Shiftlead:"Shiftlead",HCU:"HCU",CCU:"CCU",New_Joiner_HCU:"NJ \u2192 HCU",New_Joiner:"New Joiner",New_Joiner_CCU:"NJ → CCU"};

var mkeys=Object.keys(MONTHS).sort();
var mkey=(function(){var n=new Date();for(var _i=0;_i<mkeys.length;_i++){var k=mkeys[_i];if(MONTHS[k].year===n.getFullYear()&&MONTHS[k].month===n.getMonth())return k;}return mkeys[mkeys.length-1];})();
var DATA=MONTHS[mkey];
var roleFilters=[];
function inFilter(r){ return roleFilters.length===0 || roleFilters.indexOf(r)>=0; }
function roleLabels(){ return roleFilters.map(function(r){return ROLE_LABEL[r];}).join(" + "); }

function wd(d){ return (new Date(DATA.year,DATA.month,d).getDay()+6)%7; }
function info(k){ return SHIFT_INFO[k]||SHIFT_INFO["Off"]; }
function todayIndexInMonth(){ var n=new Date(); if(n.getFullYear()===DATA.year&&n.getMonth()===DATA.month) return n.getDate(); return 0; }

function setupMonths(){ var s=document.getElementById('msel'); s.innerHTML='';
  mkeys.forEach(function(k){ var o=document.createElement('option'); o.value=k; o.textContent=MONTHS[k].label; s.appendChild(o); }); s.value=mkey; }
function setupRoles(){ var s=document.getElementById('rsel'); var hh='';
  ROLES.forEach(function(r){ if(DATA.people.some(function(p){return p.role===r;})){ hh+='<label class="rchk"><input type="checkbox" value="'+r+'" '+(roleFilters.indexOf(r)>=0?'checked':'')+' onchange="onRole()"> '+ROLE_LABEL[r]+'</label>'; } });
  s.innerHTML=hh;
  roleFilters=roleFilters.filter(function(r){return DATA.people.some(function(p){return p.role===r;});});
}
function drawLegend(){ var keys=["P","Mid","S","M","Off"],h="";
  keys.forEach(function(k){ var ii=info(k); h+='<span class="lg"><span class="sw" style="background:'+ii.color+'"></span>'+ii.label+' <span class="hint">'+ii.time+'</span></span>'; });
  document.getElementById('legend').innerHTML=h; }
function periodText(){
  var active=0,total=0;
  DATA.people.forEach(function(p,i){ if(!inFilter(p.role)) return; total++; if(DATA.sched[i].indexOf("Resign")===-1) active++; });
  var resign=total-active;
  document.getElementById('period').textContent="Periode: "+MONTHS[mkey].label+"  -  "+active+" MP aktif"+(resign>0?" ("+resign+" resign)":"")+(roleFilters.length?("  -  filter: "+roleLabels()):"  (HCU+CCU+Shiftlead+New Joiner)");
}

function buildNameList(){
  var who=document.getElementById('who'); var cur=who.value;
  who.innerHTML='<option value="">-- pilih nama --</option>';
  DATA.people.map(function(p,i){return {name:p.name,role:p.role,i:i};})
   .filter(function(x){ return inFilter(x.role); })
   .sort(function(a,b){return a.name.localeCompare(b.name);})
   .forEach(function(x){ var o=document.createElement('option'); o.value=x.i; o.textContent=x.name+"  ("+x.role+")"; who.appendChild(o); });
  if(cur!==""&&DATA.people[cur]&&inFilter(DATA.people[cur].role)) who.value=cur; else who.value="";
  render();
}
function buildOnDutyDates(){ var od=document.getElementById('odDate'); od.innerHTML="";
  for(var d=1; d<=DATA.nDays; d++){ var o=document.createElement('option'); o.value=d; o.textContent=d+" "+MON_ID[DATA.month].slice(0,3)+" ("+DAY_ID[wd(d)].slice(0,3)+")"; od.appendChild(o); }
  od.value=(todayIndexInMonth()>0?todayIndexInMonth():1); }

function onMonth(){ mkey=document.getElementById('msel').value; DATA=MONTHS[mkey]; setupRoles(); periodText(); drawLegend(); buildOnDutyDates(); buildNameList(); renderGrid(); renderOnDuty(); }
function onRole(){ roleFilters=Array.prototype.slice.call(document.querySelectorAll('#rsel input:checked')).map(function(c){return c.value;}); periodText(); buildNameList(); renderGrid(); renderOnDuty(); }

function render(){
  var idx=document.getElementById('who').value;
  if(idx===""){ document.getElementById('content').style.display="none"; return; }
  idx=+idx; document.getElementById('content').style.display="block";
  var person=DATA.people[idx]; var row=DATA.sched[idx];
  document.getElementById('idNama').textContent=person.name||"-";
  document.getElementById('idPosisi').textContent=POSISI[person.tier]||person.tier||"-";
  document.getElementById('idRole').textContent=person.role||"-";
  document.getElementById('idMitra').textContent=person.mitraId||"-";
  document.getElementById('idVendor').textContent=person.vendor||"-";
  document.getElementById('idGender').textContent=person.gender||"-";
  document.getElementById('rolePill').textContent=person.role+(person.tier&&person.tier!=="SL"?" - "+person.tier:"");
  var tIdx=todayIndexInMonth();
  function box(when,dayNum){
    if(dayNum<1||dayNum>DATA.nDays) return '<div class="shiftbox" style="background:#f5f5f5"><div class="when">'+when+'</div><div class="name">-</div><div class="time">di luar periode</div></div>';
    var ii=info(row[dayNum-1]);
    return '<div class="shiftbox" style="background:'+ii.color+'"><div class="when">'+when+' ('+dayNum+' '+MON_ID[DATA.month].slice(0,3)+')</div><div class="name">'+ii.label+'</div><div class="time">'+ii.time+'</div></div>';
  }
  if(tIdx>0){ document.getElementById('todayRow').innerHTML=box("Hari Ini",tIdx)+box("Besok",tIdx+1); document.getElementById('todayHint').textContent=""; }
  else { document.getElementById('todayRow').innerHTML=box("Hari Pertama",1)+box("Hari Ke-2",2); document.getElementById('todayHint').textContent="Hari ini di luar periode jadwal terpilih."; }
  renderWeek(row, tIdx>0?tIdx:1);
  var cnt={}; for(var d=0;d<row.length;d++) cnt[row[d]]=(cnt[row[d]]||0)+1;
  var keys=["P","Mid","S","M","Off"]; var sh="";
  for(var s=0;s<keys.length;s++){ var kk=keys[s]; if(kk==="Mid"&&!cnt.Mid) continue; var ii=info(kk);
    sh+='<div class="stat" style="background:'+ii.color+'"><div class="n">'+(cnt[kk]||0)+'</div><div class="l">'+ii.label+'</div></div>'; }
  var hk=0; for(var dk=0;dk<row.length;dk++){ if(row[dk]!=="Off"&&row[dk]!=="Resign") hk++; }
  sh+='<div class="stat" style="background:#1A237E;border-color:#1A237E"><div class="n" style="color:#fff">'+hk+'</div><div class="l" style="color:#c5cae9">Total HK</div></div>';
  document.getElementById('summary').innerHTML=sh;
  var offs=[]; for(var d2=0;d2<row.length;d2++) if(row[d2]==="Off") offs.push((d2+1)+" "+MON_ID[DATA.month].slice(0,3));
  document.getElementById('offdates').innerHTML="<b>Tanggal libur saya:</b> "+(offs.length?offs.join(", "):"-");
  var ch=""; for(var c=0;c<7;c++) ch+='<div class="h">'+DAY_ID[c].slice(0,3)+'</div>';
  document.getElementById('calHead').innerHTML=ch;
  var cal=""; var first=wd(1);
  for(var e=0;e<first;e++) cal+='<div class="cell empty"></div>';
  for(var d3=1; d3<=DATA.nDays; d3++){ var ii=info(row[d3-1]); var hl=(tIdx===d3)?'box-shadow:0 0 0 2px #1A237E inset;':'';
    cal+='<div class="cell" style="background:'+ii.color+';'+hl+'"><div class="d">'+d3+'</div><div class="s">'+ii.label+'</div></div>'; }
  document.getElementById('cal').innerHTML=cal;
}
function renderWeek(row, refDay){
  var refWd=wd(refDay); var monday=refDay-refWd; var tIdx=todayIndexInMonth();
  var head=""; for(var c=0;c<7;c++) head+='<div class="h">'+DAY_ID[c].slice(0,3)+'</div>';
  document.getElementById('weekHead').innerHTML=head;
  var html="";
  for(var o=0;o<7;o++){ var dn=monday+o;
    if(dn<1||dn>DATA.nDays){ html+='<div class="cell" style="background:#f0f0f0;color:#aaa"><div class="d">-</div><div class="s">luar bulan</div></div>'; continue; }
    var ii=info(row[dn-1]); var hl=(tIdx===dn)?'box-shadow:0 0 0 2px #1A237E inset;':'';
    html+='<div class="cell" style="background:'+ii.color+';'+hl+'"><div class="d">'+dn+'</div><div class="s">'+ii.label+'</div></div>'; }
  document.getElementById('weekRow').innerHTML=html;
}
function renderGrid(){

      h+="<td class='cellg"+tc+"' style='background:"+ii.color+"'>"+lab+"</td>"; }

  });
  h+="</tbody>";

  var keys=["P","Mid","S","M","Off"];
  var rh="<thead><tr><th class='nm'>Shift</th><th></th>";
  for(var d=1; d<=DATA.nDays; d++){ var we2=wd(d)>=5; rh+="<th class='"+(we2?"wknd":"")+"'>"+d+"<br>"+DAY_ID[wd(d)].slice(0,2)+"</th>"; }
  rh+="</tr></thead><tbody>";
  keys.forEach(function(k){
    var cnts=[], tot=0;
    for(var d=0; d<DATA.nDays; d++){ var c=0; ppl.forEach(function(x){ if(DATA.sched[x.i][d]===k) c++; }); cnts.push(c); tot+=c; }
    if(k==="Mid" && tot===0) return;
    var ii=info(k);
    rh+="<tr><td class='nm' style='background:"+ii.color+";font-weight:700'>"+ii.label+"</td><td class='tier'></td>";
    for(var d=0; d<DATA.nDays; d++){ var tc=(tIdx===d+1)?" tcol":""; rh+="<td class='cellg"+tc+"'>"+cnts[d]+"</td>"; }
    rh+="</tr>";
  });
  rh+="<tr><td class='nm' style='font-weight:800;background:#e8eaf6'>Total MP Duty</td><td class='tier'></td>";
  for(var d=0; d<DATA.nDays; d++){ var c=0; ppl.forEach(function(x){ var v=DATA.sched[x.i][d]; if(v!=="Off"&&v!=="Resign") c++; }); var tc=(tIdx===d+1)?" tcol":""; rh+="<td class='cellg"+tc+"' style='font-weight:800;background:#f0f2fa'>"+c+"</td>"; }
  rh+="</tr></tbody>";
  document.getElementById('gridRecap').innerHTML=rh;
}
function renderOnDuty(){
  var day=+document.getElementById('odDate').value; if(!day||day<1) day=1;
  var sf=document.getElementById('odShift').value;
  document.getElementById('odRoleLbl').textContent=(roleFilters.length?("— "+roleLabels()):"(semua role)")+(sf?(" · "+info(sf).label):"");
  var roles=roleFilters.length?roleFilters:ROLES;
  var shiftOrder=["P","Mid","S","M","Off"]; var html=""; var grand=0;
  for(var ri=0;ri<roles.length;ri++){ var role=roles[ri]; var grp={};
    for(var i=0;i<DATA.people.length;i++){ if(DATA.people[i].role!==role) continue; var k=DATA.sched[i][day-1]; if(!grp[k])grp[k]=[]; grp[k].push(i); }
    var rh="";
    for(var s=0;s<shiftOrder.length;s++){ var kk=shiftOrder[s]; if(sf&&kk!==sf) continue; var arr=grp[kk]||[]; if(!arr.length) continue; var ii=info(kk); grand+=arr.length;
      var ppl=arr.map(function(i){ var nm=DATA.people[i].name; var tg=(DATA.people[i].tier&&DATA.people[i].tier!=="SL")?'<span class="badge">'+DATA.people[i].tier+'</span>':''; return nm+tg; }).join(", ");
      rh+='<div class="teamgrp" style="background:'+ii.color+';"><div class="t">'+ii.label+' - '+arr.length+' orang</div><div class="ppl">'+ppl+'</div></div>'; }
    if(rh) html+='<div style="margin:8px 0 4px;font-weight:800;color:#1A237E;font-size:13px;">'+ROLE_LABEL[role]+'</div>'+rh;
  }
  if(sf) html='<div class="hint" style="margin-bottom:6px;">Total shift '+info(sf).label+' (tgl '+day+'): <b>'+grand+' orang</b></div>'+html;
  if(!html) html='<div class="hint">Tidak ada yang '+(sf?('masuk shift '+info(sf).label):'bertugas')+' di tanggal ini.</div>';
  document.getElementById('onduty').innerHTML=html;
}

setupMonths(); setupRoles(); periodText(); drawLegend(); buildOnDutyDates(); buildNameList(); renderGrid(); renderOnDuty();
</script>
